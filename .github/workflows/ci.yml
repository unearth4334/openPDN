name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch: CI feedback on an old commit is
# not worth a runner.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Lowest supported version and the one the container ships.
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy

      - name: Tests
        run: pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.xml
          retention-days: 14

  domain-purity:
    name: Domain runs without dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # The domain layer has no third-party imports by design (ADR-0001). This
      # proves it on a bare interpreter, where a stray `import numpy` fails
      # instead of silently working because something else installed it.
      - name: Import the domain with nothing installed
        run: |
          PYTHONPATH=packages/domain/src python -c "
          import openpdn.domain as d
          board = d.Board(
              id=d.BoardId('b'),
              name='bare',
              stackup=d.Stackup((
                  d.Layer(
                      id=d.LayerId('L1'),
                      name='TOP',
                      function=d.LayerFunction.SIGNAL,
                      index=0,
                      thickness=d.Quantity.imported(35e-6, 'm'),
                      material=d.COPPER_ANNEALED,
                  ),
              )),
          )
          print('domain imported and constructed without dependencies:', board.name)
          "

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  container:
    name: Container build and smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build only -- publishing lives in publish.yml so that a green PR never
      # implies a released image.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: openpdn:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VCS_REF=${{ github.sha }}

      - name: Smoke test /api/health
        run: |
          docker run -d --name openpdn-ci -p 8000:8000 openpdn:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health > /tmp/health.json; then
              break
            fi
            sleep 1
          done
          cat /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json
          docker exec openpdn-ci openpdn info
          docker rm -f openpdn-ci
